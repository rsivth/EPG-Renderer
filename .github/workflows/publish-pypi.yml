name: Publish Python distributions

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out the release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install the pinned release environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,raster]"

      - name: Read and validate the release version
        id: version
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          version=$(python -c "from pathlib import Path; from tools.release_tools import project_version; print(project_version(Path.cwd()))")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "Manual TestPyPI publication must run from the default branch." >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version." >&2
            exit 1
          fi

      - name: Run the complete release gate and retain its artifacts
        run: python -m tools.run_release_checks --output-dir release

      - name: Upload only the PyPI distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: |
            release/*.tar.gz
            release/*.whl
          if-no-files-found: error
          retention-days: 7

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/epg-renderer
    permissions:
      id-token: write

    steps:
      - name: Download the verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist

      - name: Publish the distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  verify-testpypi:
    name: Verify the TestPyPI wheel
    needs: [build, publish-testpypi]
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Download the verified build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist

      - name: Download the same version from TestPyPI
        env:
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          mkdir testpypi-dist
          downloaded=false
          for attempt in {1..12}; do
            if python -m pip download \
              --index-url https://test.pypi.org/simple/ \
              --no-deps \
              --only-binary=:all: \
              --dest testpypi-dist \
              "epg-renderer==$VERSION"; then
              downloaded=true
              break
            fi
            echo "TestPyPI has not indexed the wheel yet (attempt $attempt/12)."
            sleep 10
          done
          [[ "$downloaded" == "true" ]]

      - name: Compare and smoke-test the indexed wheel
        env:
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          shopt -s nullglob
          built=(dist/*.whl)
          indexed=(testpypi-dist/*.whl)
          [[ ${#built[@]} -eq 1 && ${#indexed[@]} -eq 1 ]]
          cmp --silent "${built[0]}" "${indexed[0]}"
          python -m pip install --no-deps "${indexed[0]}"
          python -c "import epg_renderer as e; assert e.__version__ == '$VERSION'; assert len(e.list_kits()) == 14"
          [[ "$(python -m epg_renderer --version)" == "epg-render $VERSION" ]]

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [build, verify-testpypi]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/epg-renderer
    permissions:
      id-token: write

    steps:
      - name: Download the verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist

      - name: Publish the distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
