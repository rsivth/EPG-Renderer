name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install Cairo on macOS
        if: runner.os == 'macOS'
        run: |
          brew install cairo libffi
          echo "DYLD_FALLBACK_LIBRARY_PATH=$(brew --prefix cairo)/lib" >> "$GITHUB_ENV"

      - name: Install Cairo on Windows
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-cairo

      - name: Expose Cairo DLLs on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cairoBin = "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin"
          Remove-Item "$cairoBin\python.exe" -ErrorAction SilentlyContinue
          $cairoBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CAIROCFFI_DLL_DIRECTORIES=$cairoBin" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,raster]"

      - name: Verify CairoSVG runtime
        run: |
          python -c "import sys; print(sys.executable)"
          python -c "import cairosvg"

      - run: python -m tools.run_quality_checks
      - run: python -m tools.run_coverage_checks

  release:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install Cairo on macOS
        if: runner.os == 'macOS'
        run: |
          brew install cairo libffi
          echo "DYLD_FALLBACK_LIBRARY_PATH=$(brew --prefix cairo)/lib" >> "$GITHUB_ENV"

      - name: Install Cairo on Windows
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-cairo

      - name: Expose Cairo DLLs on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cairoBin = "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin"
          Remove-Item "$cairoBin\python.exe" -ErrorAction SilentlyContinue
          $cairoBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CAIROCFFI_DLL_DIRECTORIES=$cairoBin" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,raster]"

      - name: Verify CairoSVG runtime
        run: |
          python -c "import sys; print(sys.executable)"
          python -c "import cairosvg"

      - run: python -m tools.run_release_checks

  windows-binaries:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"
          architecture: x64
          cache: pip
          cache-dependency-path: packaging/windows/requirements.txt

      - name: Install native Cairo runtime
        id: msys2-binaries
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-cairo

      - name: Expose native Cairo during the build
        shell: pwsh
        run: |
          $cairoBin = "${{ steps.msys2-binaries.outputs.msys2-location }}\ucrt64\bin"
          Remove-Item "$cairoBin\python.exe" -ErrorAction SilentlyContinue
          $cairoBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CAIROCFFI_DLL_DIRECTORIES=$cairoBin" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Record native build packages
        shell: msys2 {0}
        run: pacman -Q | grep '^mingw-w64-ucrt-x86_64-' | sort

      - name: Install pinned binary-build environment
        shell: pwsh
        run: |
          python -m pip install "pip==26.2.1"
          python -m pip install -r packaging/windows/requirements.txt
          python -m pip check
          python -c "import importlib.util; assert importlib.util.find_spec('epg_renderer') is None"

      - name: Read project version
        shell: pwsh
        run: |
          $version = python -c "from pathlib import Path; from tools.release_tools import project_version; print(project_version(Path.cwd()))"
          "EPG_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Windows x64 deliverables
        run: python -m tools.build_windows_binaries --output-dir release/windows

      - name: Extract exact GUI ZIP and run isolated binary smoke tests
        shell: pwsh
        run: |
          $guiZip = "release\windows\EPG-Renderer_GUI_Windows_x64_v$env:EPG_VERSION.zip"
          $extracted = "build\windows-binary-smoke\extracted"
          Expand-Archive -LiteralPath $guiZip -DestinationPath $extracted
          python tests/smoke/binary_smoke_test.py `
            --cli "release\windows\epg-render.exe" `
            --gui "$extracted\EPG-Renderer-GUI\EPG-Renderer-GUI.exe" `
            --fixture "tests\fixtures\globalfiler_minimal.tsv" `
            --expected-version "$env:EPG_VERSION"

      - name: Upload verified Windows x64 deliverables
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-verified-${{ github.sha }}
          path: |
            release/windows/epg-render.exe
            release/windows/EPG-Renderer_GUI_Windows_x64_v*.zip
          if-no-files-found: error
          retention-days: 14
