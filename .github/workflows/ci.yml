name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install Cairo on macOS
        if: runner.os == 'macOS'
        run: |
          brew install cairo libffi
          echo "DYLD_FALLBACK_LIBRARY_PATH=$(brew --prefix cairo)/lib" >> "$GITHUB_ENV"

      - name: Install Cairo on Windows
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-cairo

      - name: Expose Cairo DLLs on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cairoBin = "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin"
          Remove-Item "$cairoBin\python.exe" -ErrorAction SilentlyContinue
          $cairoBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CAIROCFFI_DLL_DIRECTORIES=$cairoBin" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,raster]"

      - name: Verify CairoSVG runtime
        run: |
          python -c "import sys; print(sys.executable)"
          python -c "import cairosvg"

      - run: python -m tools.run_quality_checks
      - run: python -m tools.run_coverage_checks

  release:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install Cairo on macOS
        if: runner.os == 'macOS'
        run: |
          brew install cairo libffi
          echo "DYLD_FALLBACK_LIBRARY_PATH=$(brew --prefix cairo)/lib" >> "$GITHUB_ENV"

      - name: Install Cairo on Windows
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-cairo

      - name: Expose Cairo DLLs on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cairoBin = "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin"
          Remove-Item "$cairoBin\python.exe" -ErrorAction SilentlyContinue
          $cairoBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CAIROCFFI_DLL_DIRECTORIES=$cairoBin" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,raster]"

      - name: Verify CairoSVG runtime
        run: |
          python -c "import sys; print(sys.executable)"
          python -c "import cairosvg"

      - run: python -m tools.run_release_checks

  windows-binaries:
    uses: ./.github/workflows/windows-binaries.yml
